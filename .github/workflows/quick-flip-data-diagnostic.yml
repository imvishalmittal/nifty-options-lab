name: Quick Flip Data Diagnostic

on:
  push:
    branches:
      - agent/opening-range-backtest
    paths:
      - '.github/workflows/quick-flip-data-diagnostic.yml'
      - 'research/quick-flip-backtest.mjs'
      - 'research/groww-fetch-opening-range.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        period:
          - key: jan-feb-2025
            start: '2025-01-01'
            end: '2025-02-28'
          - key: jan-feb-2026
            start: '2026-01-01'
            end: '2026-02-28'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch comparison candles
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          START_DATE: ${{ matrix.period.start }}
          END_DATE: ${{ matrix.period.end }}
          PERIOD_KEY: ${{ matrix.period.key }}
          SYMBOLS: 'RELIANCE,HDFCBANK,ICICIBANK,SBIN,INFY'
        run: |
          out="work/groww/quick-flip-diagnostic/${PERIOD_KEY}/cash-5m"
          mkdir -p "${out}"
          node research/groww-fetch-opening-range.mjs \
            "--start=${START_DATE}" \
            "--end=${END_DATE}" \
            "--symbols=${SYMBOLS}" \
            "--out=${out}" \
            > "work/groww/quick-flip-diagnostic/${PERIOD_KEY}/manifest-output.json"

      - name: Run diagnostics and capture timestamp samples
        env:
          PERIOD_KEY: ${{ matrix.period.key }}
        run: |
          input="work/groww/quick-flip-diagnostic/${PERIOD_KEY}/cash-5m"
          output="outputs/quick-flip-diagnostic/${PERIOD_KEY}"
          mkdir -p "${output}"
          mapfile -t files < <(find "${input}" -maxdepth 1 -name '*.csv' -type f | sort)
          node research/quick-flip-backtest.mjs "${files[@]}" > "${output}/quick-flip.json"
          cp "${input}/manifest.json" "${output}/data-manifest.json"
          : > "${output}/timestamp-samples.txt"
          for file in "${files[@]}"; do
            echo "===== $(basename "$file") =====" >> "${output}/timestamp-samples.txt"
            head -n 12 "$file" >> "${output}/timestamp-samples.txt"
            echo >> "${output}/timestamp-samples.txt"
          done

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-flip-diagnostic-${{ matrix.period.key }}-${{ github.run_id }}
          path: outputs/quick-flip-diagnostic/${{ matrix.period.key }}/
          if-no-files-found: error
          retention-days: 14
