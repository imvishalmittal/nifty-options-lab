name: Research - chain NIFTY opportunity suite

on:
  workflow_run:
    workflows:
      - Research - NIFTY late breakout retest
      - Research - NIFTY VWAP trend pullback
      - Research - NIFTY failed opening-range break
      - Research - NIFTY afternoon compression breakout
      - Research - compare NIFTY opportunity strategies
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  advance:
    if: >-
      github.event.workflow_run.head_branch == 'research/opportunity-runs' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opportunity-runs
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/opportunity-chain.test.mjs
      - name: Record result and dispatch next workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_BRANCH: research/opportunity-runs
          SUITE_FILE: research/opportunity/requests/suite.json
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node research/opportunity/chain-dispatch.mjs
