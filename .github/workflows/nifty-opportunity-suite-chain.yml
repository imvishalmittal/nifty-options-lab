name: Research - chain NIFTY opportunity suite

on:
  workflow_run:
    workflows:
      - Research - NIFTY late breakout retest
      - Research - NIFTY VWAP trend pullback
      - Research - NIFTY failed opening-range break
      - Research - NIFTY afternoon compression breakout
      - Research - compare NIFTY opportunity strategies
    types: [completed]
  workflow_dispatch:
    inputs:
      completed_workflow: { description: Completed suite workflow name, required: true, type: string }
      completed_run_id: { description: Completed suite workflow run ID, required: true, type: string }
      conclusion: { description: Completed suite workflow conclusion, required: true, type: choice, options: [success, failure, cancelled] }
  push:
    branches: [main]
    paths:
      - .github/workflows/nifty-opportunity-suite-chain.yml
      - research/opportunity/chain-dispatch.mjs

permissions:
  contents: write
  actions: write
concurrency:
  group: nifty-opportunity-suite-chain
  cancel-in-progress: false
  queue: max

jobs:
  advance:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'research/opportunity-runs' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/opportunity-chain.test.mjs
      - name: Record result and dispatch next workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_BRANCH: research/opportunity-runs
          SUITE_FILE: research/opportunity/requests/suite.json
          COMPLETED_WORKFLOW: ${{ inputs.completed_workflow || github.event.workflow_run.name }}
          COMPLETED_RUN_ID: ${{ inputs.completed_run_id || github.event.workflow_run.id }}
          CONCLUSION: ${{ inputs.conclusion || github.event.workflow_run.conclusion }}
        run: node research/opportunity/chain-dispatch.mjs
