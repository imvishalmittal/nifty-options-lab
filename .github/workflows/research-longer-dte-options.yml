name: Research - P2 P4 P6 longer-DTE options
on:
  workflow_dispatch:
  push:
    branches: [agent/longer-dte-options-runs]
    paths: [research/requests/longer-dte-options.json]
permissions: { contents: read }
jobs:
  history:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: { year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022] }
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/positional-futures-engine.test.mjs tests/longer-dte-options-engine.test.mjs
      - run: node research/download-nse-futures-history.mjs --include-options=true --start=${{ matrix.year }}-01-01 --end=${{ matrix.year }}-12-31 --out=nifty-derivatives-${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'nifty-derivatives-${{ matrix.year }}', path: 'nifty-derivatives-${{ matrix.year }}.json', if-no-files-found: error, retention-days: 90 }
  finalize:
    needs: history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'nifty-derivatives-*', path: shards, merge-multiple: true }
      - run: node research/run-longer-dte-options-backtest.mjs --in=shards --start=2016-01-01 --end=2022-12-31 --out=longer-dte-options-discovery.json
      - run: node research/longer-dte-options-gates.mjs --in=longer-dte-options-discovery.json --out=longer-dte-options-gates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longer-dte-options-discovery-2016-2022
          path: |
            longer-dte-options-discovery.json
            longer-dte-options-gates.json
          if-no-files-found: error
          retention-days: 90
      - run: node research/longer-dte-options-gates.mjs --in=longer-dte-options-discovery.json --out=longer-dte-options-gates.json --enforce=true
