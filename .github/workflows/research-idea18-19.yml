name: Research - Ideas 18-19 diagnostics
on:
  workflow_dispatch:
  push:
    branches: [agent/idea10-underlying-option-confirmation]
    paths:
      - research/idea18-19-diagnostic.mjs
      - .github/workflows/research-idea18-19.yml
permissions: { contents: read }
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve Groww token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run Ideas 18-19 diagnostics
        run: |
          node research/idea18-19-diagnostic.mjs \
            --start=2026-01-01 --end=2026-09-19 \
            --out=idea18-19-2026-diagnostic.json
      - uses: actions/upload-artifact@v4
        with:
          name: idea18-19-2026-diagnostic
          path: idea18-19-2026-diagnostic.json
          retention-days: 90

# Manual rerun trigger: Idea 18/19 diagnostics 2026-09-26
