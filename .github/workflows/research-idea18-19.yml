name: Research - Idea 19 discovery screen
on:
  workflow_dispatch:
  push:
    branches: [agent/idea10-underlying-option-confirmation]
    paths:
      - research/idea18-19-diagnostic.mjs
      - .github/workflows/research-idea18-19.yml
permissions: { contents: write }
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve Groww token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run frozen Idea 10 discovery baseline
        run: |
          node research/groww-idea10-2026-diagnostic.mjs \
            --start=2020-01-01 --end=2024-12-31 \
            --variant=A --out=idea19-discovery-baseline.json
      - name: Screen frozen Idea 19 time buckets
        run: |
          node research/idea19-discovery-screen.mjs \
            idea19-discovery-baseline.json idea19-discovery-2020-2024.json
      - uses: actions/upload-artifact@v4
        with:
          name: idea19-discovery-2020-2024
          path: idea19-discovery-2020-2024.json
          retention-days: 90

# Manual rerun trigger: Idea 18/19 diagnostics 2026-09-26


      - name: Persist Idea 19 discovery result for retrieval
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idea19-discovery-2020-2024.json
          git diff --cached --quiet || git commit -m "Persist Ideas 18-19 diagnostic result"
          git push origin HEAD:agent/idea10-underlying-option-confirmation

# Idea 19 discovery screen is descriptive until a discovery-only candidate is selected; no validation/holdout is run in this job.
