name: Research - Morning Tea stock options

on:
  workflow_dispatch:
    inputs:
      start: { description: YYYY-MM-DD, required: true, type: string, default: '2026-08-03' }
      end: { description: YYYY-MM-DD, required: true, type: string, default: '2026-08-21' }
permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/morning-tea-engine.test.mjs tests/groww-option-costs.test.mjs
      - name: Resolve Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run frozen one-minute proxy
        run: node research/morning-tea/groww-backtest.mjs --start=${{ inputs.start }} --end=${{ inputs.end }} --out=result.json
      - name: Verify integrity
        run: node research/morning-tea/integrity.mjs --in=result.json --out=integrity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morning-tea-${{ inputs.start }}-${{ inputs.end }}
          path: |
            result.json
            integrity.json
          retention-days: 90
