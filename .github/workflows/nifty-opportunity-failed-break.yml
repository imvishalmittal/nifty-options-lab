name: Research - NIFTY failed opening-range break

on:
  workflow_dispatch:
    inputs:
      scope: { description: Backtest partition set, required: true, type: choice, default: validation-2025, options: [discovery-2020-2024, validation-2025, holdout-2026, custom] }
      custom_start: { description: 'YYYY-MM-DD (custom only)', required: false, type: string }
      custom_end: { description: 'YYYY-MM-DD (custom only)', required: false, type: string }
      custom_lot_size: { description: Lot size (custom only), required: false, type: number, default: 65 }
  push:
    branches: [research/opportunity-runs]
    paths: [research/opportunity/requests/failed-break.json]
permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false, queue: max }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.result }}', count: '${{ steps.matrix.outputs.count }}' }
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env: { INPUT_SCOPE: '${{ inputs.scope }}', INPUT_CUSTOM_START: '${{ inputs.custom_start }}', INPUT_CUSTOM_END: '${{ inputs.custom_end }}', INPUT_CUSTOM_LOT: '${{ inputs.custom_lot_size }}', REQUEST_FILE: research/opportunity/requests/failed-break.json }
        run: node research/opportunity/workflow-plan.mjs
  backtest:
    needs: plan
    strategy: { fail-fast: false, max-parallel: 1, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}' }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/opportunity-engine.test.mjs
      - env: { GROWW_ACCESS_TOKEN: '${{ secrets.GROWW_ACCESS_TOKEN }}' }
        run: node research/opportunity/groww-opportunity-backtest.mjs --strategy=failed-opening-range-break --start=${{ matrix.start }} --end=${{ matrix.end }} --lot-size=${{ matrix.lot }} --out=result.json
      - run: node research/opportunity/result-integrity.mjs --in=result.json --out=integrity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'opportunity-failed-opening-range-break-part-${{ matrix.label }}', path: "result.json\nintegrity.json", retention-days: 90 }
  consolidate:
    if: ${{ !cancelled() }}
    needs: [plan, backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'opportunity-failed-opening-range-break-part-*', path: artifacts }
      - run: node research/opportunity/aggregate-results.mjs --dir=artifacts --strategy=failed-opening-range-break --expected-count=${{ needs.plan.outputs.count }} --out=consolidated.json
      - run: node research/opportunity/result-integrity.mjs --in=consolidated.json --out=consolidated-integrity.json
      - uses: actions/upload-artifact@v4
        with: { name: opportunity-failed-opening-range-break-consolidated, path: "consolidated.json\nconsolidated-integrity.json", retention-days: 90 }
