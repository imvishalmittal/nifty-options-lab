name: Research - M3 multi-index opening-range credit
on:
  workflow_dispatch:
permissions: { contents: read, actions: write }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs: { evidence_complete: "${{ steps.complete.outputs.value }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/multi-index-credit-engine.test.mjs tests/multi-index-credit-pipeline.test.mjs
      - name: Resolve one Groww token for the complete run
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'false'
        run: node scripts/resolve-groww-token.mjs
      - name: Run all monthly M3 shards
        run: |
          set -euo pipefail
          mkdir -p shards
          for year in $(seq 2020 2024); do for month in $(seq -w 1 12); do
            key="$year-$month"; end=$(date -u -d "$key-01 +1 month -1 day" +%Y-%m-%d)
            node research/groww-multi-index-opening-range-backtest.mjs --mode=M3 --underlying=ALL --start="$key-01" --end="$end" --out="shards/m3-$key.json"
          done; done
      - run: node research/merge-multi-index-credit-shards.mjs --in=shards --start=2020-01-01 --end=2024-12-31 --expected=60 --out=m3.json
      - run: node research/multi-index-credit-gates.mjs --in=m3.json --out=m3-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-discovery-2020-2024
          path: |
            shards
            m3.json
            m3-gate.json
          if-no-files-found: warn
          retention-days: 90
      - id: complete
        run: echo "value=true" >> "$GITHUB_OUTPUT"
      - run: node research/multi-index-credit-gates.mjs --in=m3.json --out=m3-gate.json --enforce=true
  dispatch-c1:
    if: ${{ always() && needs.research.outputs.evidence_complete == 'true' }}
    needs: research
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run research-nifty-180-spread-skew.yml --repo imvishalmittal/nifty-options-lab --ref main
