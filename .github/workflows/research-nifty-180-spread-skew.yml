name: Research - C1 NIFTY 180 spread skew
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/multi-index-credit-engine.test.mjs tests/multi-index-credit-pipeline.test.mjs
      - name: Resolve one Groww token for the complete run
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'false'
        run: node scripts/resolve-groww-token.mjs
      - name: Run all monthly C1 shards
        run: |
          set -euo pipefail
          mkdir -p shards
          for year in $(seq 2020 2024); do for month in $(seq -w 1 12); do
            key="$year-$month"; end=$(date -u -d "$key-01 +1 month -1 day" +%Y-%m-%d)
            node research/groww-multi-index-opening-range-backtest.mjs --mode=C1 --underlying=NIFTY --spot-symbol=NSE-NIFTY --start="$key-01" --end="$end" --out="shards/c1-$key.json"
          done; done
      - run: node research/merge-multi-index-credit-shards.mjs --in=shards --start=2020-01-01 --end=2024-12-31 --expected=60 --out=c1.json
      - run: node research/multi-index-credit-gates.mjs --in=c1.json --out=c1-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-discovery-2020-2024
          path: |
            shards
            c1.json
            c1-gate.json
          if-no-files-found: warn
          retention-days: 90
      - run: node research/multi-index-credit-gates.mjs --in=c1.json --out=c1-gate.json --enforce=true
