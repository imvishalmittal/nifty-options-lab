name: Paper Ledger V3 Backfill

on:
  push:
    branches: [main]
    paths:
      - 'paper/backfill-stepped-ledger.mjs'
      - '.github/workflows/paper-ledger-v3-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: paper-ledger-v3-backfill
  cancel-in-progress: false

jobs:
  backfill-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CAPITAL: '60000'
      TRAIL_GAP: '20'
      TRAIL_STEPS: '5,10'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download integrity-passed 2025 stepped artifacts
        env:
          RUN_ID: '31942482047'
        run: |
          set -euo pipefail
          root=/tmp/nifty-stepped-2025
          mkdir -p "$root"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          for month in 01 02 03 04 05 06 07 08 09 11; do
            name="nifty-180-stepped-2025-${month}-${RUN_ID}"
            id=$(echo "$artifacts" | jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' | head -1)
            test -n "$id" && test "$id" != "null"
            mkdir -p "$root/$month"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$root/$month.zip"
            unzip -q "$root/$month.zip" -d "$root/$month"
          done
      - name: Add V3 2025 outcomes
        env:
          BACKFILL_YEAR: '2025'
        run: node paper/backfill-stepped-ledger.mjs /tmp/nifty-stepped-2025 public/paper/trades.json
      - name: Download integrity-passed 2026 stepped artifacts
        env:
          RUN_ID: '31945711135'
        run: |
          set -euo pipefail
          root=/tmp/nifty-stepped-2026
          mkdir -p "$root"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          # March and July failed the same completeness gates as V2 and stay excluded.
          for month in 01 02 04 05 06 08; do
            name="nifty-180-stepped-2026-${month}-${RUN_ID}"
            id=$(echo "$artifacts" | jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' | head -1)
            test -n "$id" && test "$id" != "null"
            mkdir -p "$root/$month"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$root/$month.zip"
            unzip -q "$root/$month.zip" -d "$root/$month"
          done
      - name: Add V3 2026 outcomes
        env:
          BACKFILL_YEAR: '2026'
        run: node paper/backfill-stepped-ledger.mjs /tmp/nifty-stepped-2026 public/paper/trades.json
      - name: Verify matched cohorts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { trades } = JSON.parse(fs.readFileSync('public/paper/trades.json','utf8'));
          const key = r => `${r.date}|${r.callType}|${r.strikePrice}|${r.entryTime}`;
          const v2 = new Set(trades.filter(r => r.source === 'BACKTEST' && r.strategy === 'NIFTY ₹180 Momentum V2').map(key));
          for (const step of [5,10]) {
            const v3 = new Set(trades.filter(r => r.source === 'BACKTEST' && r.strategy === 'NIFTY ₹180 Stepped Trail V3' && r.trailStepPoints === step).map(key));
            if (v2.size !== v3.size || [...v2].some(k => !v3.has(k))) throw new Error(`V2/V3 ${step} cohort mismatch: ${v2.size} vs ${v3.size}`);
            console.log(`Matched V2 and V3 ${step}-point cohorts: ${v2.size} trades`);
          }
          NODE
      - name: Persist V3 outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper/trades.json
          if git diff --cached --quiet; then
            echo "V3 ledger already current"
          else
            git commit -m "Backfill validated V3 stepped outcomes"
            git push origin HEAD:main
          fi
