name: Research - Profit-only initial-risk caps
on:
  workflow_dispatch:
  push:
    branches: [agent/profit-only-risk-cap-runs]
    paths: [research/requests/profit-only-risk-caps.json]
permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.months.outputs.matrix }}" }
    steps:
      - id: months
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const include=[];for(let year=2020;year<=2024;year+=1)for(let month=1;month<=12;month+=1){const key=`${year}-${String(month).padStart(2,'0')}`;include.push({month:key,start:`${key}-01`,end:`${key}-${new Date(Date.UTC(year,month,0)).getUTCDate()}`})}console.log(`matrix=${JSON.stringify({include})}`);
          NODE
  shard:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/profit-only-directional-engine.test.mjs tests/profit-only-directional-pipeline.test.mjs tests/profit-only-risk-caps.test.mjs
      - name: Resolve Groww token
        env:
          GROWW_ACCESS_TOKEN: "${{ secrets.GROWW_ACCESS_TOKEN }}"
          GROWW_TOTP_TOKEN: "${{ secrets.GROWW_TOTP_TOKEN }}"
          GROWW_TOTP_SECRET: "${{ secrets.GROWW_TOTP_SECRET }}"
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run shard
        run: >-
          node research/groww-profit-only-directional-backtest.mjs
          --start=${{ matrix.start }} --end=${{ matrix.end }} --lot-size=65
          --signals=RETEST15,PREVIOUS_DAY_BREAK
          --exits=CONFIRM_BE_10,CONFIRM_BE_10_CAP_5,CONFIRM_BE_10_CAP_10,CONFIRM_BE_10_CAP_15
          --out=profit-only-risk-caps-${{ matrix.month }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profit-only-risk-caps-${{ matrix.month }}
          path: profit-only-risk-caps-${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 90
  finalize:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: "profit-only-risk-caps-*", path: shards, merge-multiple: true }
      - run: >-
          node research/merge-profit-only-directional-shards.mjs --in=shards
          --start=2020-01-01 --end=2024-12-31 --expected=60 --out=profit-only-risk-caps.json
      - run: node research/profit-only-risk-cap-gates.mjs --in=profit-only-risk-caps.json --out=profit-only-risk-caps-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profit-only-risk-caps-discovery-2020-2024
          path: |
            profit-only-risk-caps.json
            profit-only-risk-caps-gate.json
          if-no-files-found: error
          retention-days: 90
      - run: node research/profit-only-risk-cap-gates.mjs --in=profit-only-risk-caps.json --out=profit-only-risk-caps-gate.json --enforce=true
