name: Research - Selective NIFTY VWAP V2 discovery

on:
  workflow_dispatch:
  push:
    branches: [research/next-opportunity-strategies]
    paths: [research/next/requests/selective-vwap-v2.json]

permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false, queue: max }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.result }}', count: '${{ steps.matrix.outputs.count }}' }
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env: { REQUEST_FILE: research/next/requests/selective-vwap-v2.json }
        run: node research/opportunity/workflow-plan.mjs
  backtest:
    needs: plan
    strategy: { fail-fast: false, max-parallel: 1, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}' }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/opportunity-engine.test.mjs tests/next-strategy-research.test.mjs
      - name: Resolve Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Backtest locked V2 partition
        run: >-
          node research/opportunity/groww-opportunity-backtest.mjs
          --strategy=selective-vwap-trend-pullback-v2
          --start=${{ matrix.start }} --end=${{ matrix.end }}
          --lot-size=${{ matrix.lot }} --out=result.json
      - name: Strict integrity gate
        run: node research/opportunity/result-integrity.mjs --in=result.json --out=integrity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-vwap-v2-part-${{ matrix.label }}
          path: |
            result.json
            integrity.json
          retention-days: 90
  consolidate:
    if: ${{ !cancelled() }}
    needs: [plan, backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'selective-vwap-v2-part-*', path: artifacts }
      - run: >-
          node research/opportunity/aggregate-results.mjs
          --dir=artifacts --strategy=selective-vwap-trend-pullback-v2
          --expected-count=${{ needs.plan.outputs.count }} --out=consolidated.json
      - run: node research/opportunity/result-integrity.mjs --in=consolidated.json --out=consolidated-integrity.json
      - run: node research/next/research-gates.mjs --in=consolidated.json --type=vwap --out=gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: selective-vwap-v2-discovery-2020-2024
          path: |
            consolidated.json
            consolidated-integrity.json
            gate.json
          retention-days: 90
