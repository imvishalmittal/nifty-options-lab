name: NIFTY 180 Stepped Trail 2025

on:
  push:
    branches:
      - agent/breakeven-trail
    paths:
      - '.github/workflows/nifty-180-stepped-2025.yml'
      - 'research/nifty-180-stepped-trail.mjs'
      - 'research/groww-backtest-nifty-180-stepped.mjs'
      - 'research/stepped-result-integrity.mjs'
      - 'tests/nifty-180-stepped-trail.test.mjs'
      - 'paper/paper-engine.mjs'
      - 'tests/paper-engine.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  month:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: groww-backtest-api
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        period:
          - { key: '2025-01', start: '2025-01-01', end: '2025-01-31' }
          - { key: '2025-02', start: '2025-02-01', end: '2025-02-28' }
          - { key: '2025-03', start: '2025-03-01', end: '2025-03-31' }
          - { key: '2025-04', start: '2025-04-01', end: '2025-04-30' }
          - { key: '2025-05', start: '2025-05-01', end: '2025-05-31' }
          - { key: '2025-06', start: '2025-06-01', end: '2025-06-30' }
          - { key: '2025-07', start: '2025-07-01', end: '2025-07-31' }
          - { key: '2025-08', start: '2025-08-01', end: '2025-08-31' }
          - { key: '2025-09', start: '2025-09-01', end: '2025-09-30' }
          - { key: '2025-10', start: '2025-10-01', end: '2025-10-31' }
          - { key: '2025-11', start: '2025-11-01', end: '2025-11-30' }
          - { key: '2025-12', start: '2025-12-01', end: '2025-12-31' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stepped engines
        run: node --test tests/paper-engine.test.mjs tests/nifty-180-stepped-trail.test.mjs tests/nifty-180-premium-strategy.test.mjs tests/groww-backtest-nifty-180.test.mjs tests/groww-option-costs.test.mjs
      - name: Compare 5-point and 10-point steps
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_REQUEST_SPACING_MS: '1500'
          PERIOD_KEY: ${{ matrix.period.key }}
          START_DATE: ${{ matrix.period.start }}
          END_DATE: ${{ matrix.period.end }}
        run: |
          mkdir -p "outputs/nifty-180-stepped-2025/${PERIOD_KEY}"
          node research/groww-backtest-nifty-180-stepped.mjs \
            "--start=${START_DATE}" \
            "--end=${END_DATE}" \
            --lot-size=75 \
            "--out=outputs/nifty-180-stepped-2025/${PERIOD_KEY}/result.json" \
            > "outputs/nifty-180-stepped-2025/${PERIOD_KEY}/stdout.json"
      - name: Upload monthly result
        uses: actions/upload-artifact@v4
        with:
          name: nifty-180-stepped-${{ matrix.period.key }}-${{ github.run_id }}
          path: outputs/nifty-180-stepped-2025/${{ matrix.period.key }}/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete research month
        run: node research/stepped-result-integrity.mjs "outputs/nifty-180-stepped-2025/${{ matrix.period.key }}/result.json"
