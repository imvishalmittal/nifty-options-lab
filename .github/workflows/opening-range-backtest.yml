name: Opening Range Backtest

on:
  push:
    branches:
      - agent/opening-range-backtest
    paths:
      - '.github/workflows/opening-range-backtest.yml'
      - 'research/groww-fetch-opening-range.mjs'
      - 'research/opening-range-backtest.mjs'
      - 'research/opening-range-window-study.mjs'
  workflow_dispatch:
    inputs:
      start_date:
        description: Start date (YYYY-MM-DD)
        required: true
        default: '2020-01-01'
      end_date:
        description: End date (YYYY-MM-DD); leave blank to use yesterday IST
        required: false
        default: ''
      symbols:
        description: Comma-separated NSE symbols
        required: true
        default: 'RELIANCE,HDFCBANK,ICICIBANK,SBIN,INFY'

permissions:
  contents: read

jobs:
  baseline:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        period:
          - key: research-2020-2024
            start: '2020-01-01'
            end: '2024-12-31'
          - key: validation-2025
            start: '2025-01-01'
            end: '2025-12-31'
          - key: recent-2026
            start: '2026-01-01'
            end: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Groww 5-minute stock candles
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          START_DATE: ${{ matrix.period.start }}
          END_DATE: ${{ matrix.period.end }}
          SYMBOLS: 'RELIANCE,HDFCBANK,ICICIBANK,SBIN,INFY'
          PERIOD_KEY: ${{ matrix.period.key }}
        run: |
          out="work/groww/${PERIOD_KEY}/cash-5m"
          mkdir -p "${out}"
          args=("--start=${START_DATE}" "--symbols=${SYMBOLS}" "--out=${out}")
          if [[ -n "${END_DATE}" ]]; then args+=("--end=${END_DATE}"); fi
          node research/groww-fetch-opening-range.mjs "${args[@]}" > "work/groww/${PERIOD_KEY}/manifest-output.json"

      - name: Run 15/30/60/75-minute opening-range study
        env:
          PERIOD_KEY: ${{ matrix.period.key }}
        run: |
          input="work/groww/${PERIOD_KEY}/cash-5m"
          output="outputs/opening-range/${PERIOD_KEY}"
          mkdir -p "${output}"
          mapfile -t files < <(find "${input}" -maxdepth 1 -name '*.csv' -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No candle files were generated' >&2
            exit 1
          fi
          node research/opening-range-window-study.mjs "${files[@]}" > "${output}/window-study.json"
          cp "${input}/manifest.json" "${output}/data-manifest.json"

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: opening-range-${{ matrix.period.key }}-${{ github.run_id }}
          path: outputs/opening-range/${{ matrix.period.key }}/
          if-no-files-found: error
          retention-days: 30

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Groww 5-minute stock candles
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          mkdir -p work/groww/cash-5m
          args=("--start=${START_DATE}" "--symbols=${SYMBOLS}" "--out=work/groww/cash-5m")
          if [[ -n "${END_DATE}" ]]; then args+=("--end=${END_DATE}"); fi
          node research/groww-fetch-opening-range.mjs "${args[@]}" > work/groww/manifest-output.json

      - name: Run 15/30/60/75-minute opening-range study
        run: |
          mkdir -p outputs/opening-range/manual
          mapfile -t files < <(find work/groww/cash-5m -maxdepth 1 -name '*.csv' -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No candle files were generated' >&2
            exit 1
          fi
          node research/opening-range-window-study.mjs "${files[@]}" > outputs/opening-range/manual/window-study.json
          cp work/groww/cash-5m/manifest.json outputs/opening-range/manual/data-manifest.json

      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: opening-range-manual-${{ github.run_id }}
          path: outputs/opening-range/manual/
          if-no-files-found: error
          retention-days: 30
