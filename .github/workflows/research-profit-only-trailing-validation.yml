name: Research - Profit-only trailing validation

on:
  workflow_dispatch:
  push:
    branches: [agent/profit-only-trailing-validation-runs]
    paths: [research/requests/profit-only-trailing-validation.json]

permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.months.outputs.matrix }}" }
    steps:
      - id: months
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const include=[];
          for(let year=2025;year<=2026;year+=1){
            const last=year===2025?12:9;
            for(let month=1;month<=last;month+=1){
              const key=`${year}-${String(month).padStart(2,'0')}`;
              const end=key==='2026-09'?'2026-09-08':`${key}-${new Date(Date.UTC(year,month,0)).getUTCDate()}`;
              include.push({month:key,start:`${key}-01`,end});
            }
          }
          console.log(`matrix=${JSON.stringify({include})}`);
          NODE

  shard:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: "${{ fromJSON(needs.prepare.outputs.matrix) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/profit-only-directional-engine.test.mjs tests/profit-only-directional-pipeline.test.mjs tests/profit-only-trailing-gates.test.mjs
      - name: Resolve Groww token
        env:
          GROWW_ACCESS_TOKEN: "${{ secrets.GROWW_ACCESS_TOKEN }}"
          GROWW_TOTP_TOKEN: "${{ secrets.GROWW_TOTP_TOKEN }}"
          GROWW_TOTP_SECRET: "${{ secrets.GROWW_TOTP_SECRET }}"
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run validation shard
        run: >-
          node research/groww-profit-only-directional-backtest.mjs
          --start=${{ matrix.start }} --end=${{ matrix.end }} --lot-size=65
          --out=profit-only-trailing-validation-${{ matrix.month }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profit-only-trailing-validation-${{ matrix.month }}
          path: profit-only-trailing-validation-${{ matrix.month }}.json
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: "profit-only-trailing-validation-*", path: shards, merge-multiple: true }
      - run: >-
          node research/merge-profit-only-directional-shards.mjs --in=shards
          --start=2025-01-01 --end=2026-09-08 --expected=21
          --out=profit-only-trailing-validation.json
      - run: node research/profit-only-trailing-gates.mjs --in=profit-only-trailing-validation.json --out=profit-only-trailing-validation-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profit-only-trailing-validation-2025-2026
          path: |
            profit-only-trailing-validation.json
            profit-only-trailing-validation-gate.json
          if-no-files-found: error
          retention-days: 90
      - run: node research/profit-only-trailing-gates.mjs --in=profit-only-trailing-validation.json --out=profit-only-trailing-validation-gate.json --enforce=true
