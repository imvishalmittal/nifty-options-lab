name: Research - Profit-only trailing validation
on:
  workflow_dispatch:
permissions: { contents: read, actions: write }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs: { evidence_complete: "${{ steps.complete.outputs.value }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/profit-only-directional-engine.test.mjs tests/profit-only-directional-pipeline.test.mjs tests/profit-only-trailing-gates.test.mjs
      - name: Resolve one Groww token for the complete run
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'false'
        run: node scripts/resolve-groww-token.mjs
      - name: Run all validation shards
        run: |
          set -euo pipefail
          mkdir -p shards
          for year in 2025 2026; do
            last=12; [ "$year" = 2026 ] && last=9
            for month in $(seq -w 1 "$last"); do
              key="$year-$month"; end=$(date -u -d "$key-01 +1 month -1 day" +%Y-%m-%d); [ "$key" = 2026-09 ] && end=2026-09-08
              node research/groww-profit-only-directional-backtest.mjs --start="$key-01" --end="$end" --lot-size=65 --out="shards/profit-only-trailing-validation-$key.json"
            done
          done
      - run: node research/merge-profit-only-directional-shards.mjs --in=shards --start=2025-01-01 --end=2026-09-08 --expected=21 --out=profit-only-trailing-validation.json
      - run: node research/profit-only-trailing-gates.mjs --in=profit-only-trailing-validation.json --out=profit-only-trailing-validation-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profit-only-trailing-validation-2025-2026
          path: |
            shards
            profit-only-trailing-validation.json
            profit-only-trailing-validation-gate.json
          if-no-files-found: warn
          retention-days: 90
      - id: complete
        run: echo "value=true" >> "$GITHUB_OUTPUT"
      - run: node research/profit-only-trailing-gates.mjs --in=profit-only-trailing-validation.json --out=profit-only-trailing-validation-gate.json --enforce=true
  dispatch-m3:
    if: ${{ always() && needs.research.outputs.evidence_complete == 'true' }}
    needs: research
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run research-multi-index-opening-range-credit.yml --repo imvishalmittal/nifty-options-lab --ref main
