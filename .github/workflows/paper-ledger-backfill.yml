name: Paper Ledger Backfill

on:
  push:
    branches: [main]
    paths:
      - 'paper/backfill-ledger.mjs'
      - '.github/workflows/paper-ledger-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  backfill-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '31933797806'
      BACKFILL_YEAR: '2025'
      TRAIL_GAP: '20'
      CAPITAL: '60000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download validated momentum artifacts
        run: |
          set -euo pipefail
          root=/tmp/nifty-momentum-backfill
          mkdir -p "$root"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          for month in 01 02 03 04 05 06 07 08 09 11; do
            name="nifty-180-momentum-2025-${month}-${RUN_ID}"
            id=$(echo "$artifacts" | jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' | head -1)
            test -n "$id" && test "$id" != "null"
            mkdir -p "$root/$month"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$root/$month.zip"
            unzip -q "$root/$month.zip" -d "$root/$month"
          done
      - name: Build auditable ledger
        run: node paper/backfill-ledger.mjs /tmp/nifty-momentum-backfill public/paper/trades.json
      - name: Persist backfilled ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper/trades.json
          if git diff --cached --quiet; then
            echo "Ledger already current"
          else
            git commit -m "Backfill validated 2025 momentum trades"
            git push origin HEAD:main
          fi

  backfill-2026:
    needs: backfill-2025
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '31938375236'
      BACKFILL_YEAR: '2026'
      TRAIL_GAP: '20'
      CAPITAL: '60000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download integrity-passed 2026 momentum artifacts
        run: |
          set -euo pipefail
          root=/tmp/nifty-momentum-backfill
          mkdir -p "$root"
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")
          # March and July are deliberately excluded: their integrity gates failed.
          for month in 01 02 04 05 06 08; do
            name="nifty-180-momentum-2026-${month}-${RUN_ID}"
            id=$(echo "$artifacts" | jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' | head -1)
            test -n "$id" && test "$id" != "null"
            mkdir -p "$root/$month"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$root/$month.zip"
            unzip -q "$root/$month.zip" -d "$root/$month"
          done
      - name: Build 20-point 2026 holdout ledger
        run: node paper/backfill-ledger.mjs /tmp/nifty-momentum-backfill public/paper/trades.json
      - name: Persist validated 2026 holdout rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper/trades.json
          if git diff --cached --quiet; then
            echo "2026 ledger already current"
          else
            git commit -m "Backfill validated 2026 momentum trades"
            git push origin HEAD:main
          fi
