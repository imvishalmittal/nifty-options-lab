name: Stocks in Play ORB

on:
  push:
    branches:
      - agent/opening-range-backtest
    paths:
      - '.github/workflows/stocks-in-play-orb.yml'
      - 'research/stocks-in-play-orb-backtest.mjs'
      - 'research/quick-flip-backtest.mjs'
      - 'research/groww-fetch-opening-range.mjs'
      - 'tests/stocks-in-play-orb-backtest.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: groww-backtest-api
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        period:
          - key: research-2020-2024
            start: '2020-01-01'
            end: '2024-12-31'
          - key: validation-2025
            start: '2025-01-01'
            end: '2025-12-31'
          - key: recent-2026
            start: '2026-01-01'
            end: '2026-08-14'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Stocks in Play rules
        run: node --test tests/stocks-in-play-orb-backtest.test.mjs tests/quick-flip-backtest.test.mjs

      - name: Fetch liquid-stock Groww 5-minute candles
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          START_DATE: ${{ matrix.period.start }}
          END_DATE: ${{ matrix.period.end }}
          PERIOD_KEY: ${{ matrix.period.key }}
          SYMBOLS: 'RELIANCE,HDFCBANK,ICICIBANK,SBIN,INFY,AXISBANK,KOTAKBANK,BAJFINANCE,BHARTIARTL,ITC,TCS,TATAMOTORS,LT,TATASTEEL,ONGC'
        run: |
          out="work/groww/stocks-in-play/${PERIOD_KEY}/cash-5m"
          mkdir -p "${out}"
          node research/groww-fetch-opening-range.mjs \
            "--start=${START_DATE}" \
            "--end=${END_DATE}" \
            "--symbols=${SYMBOLS}" \
            "--out=${out}" \
            > "work/groww/stocks-in-play/${PERIOD_KEY}/manifest-output.json"

      - name: Run predeclared RVOL variants
        env:
          PERIOD_KEY: ${{ matrix.period.key }}
        run: |
          input="work/groww/stocks-in-play/${PERIOD_KEY}/cash-5m"
          output="outputs/stocks-in-play-orb/${PERIOD_KEY}"
          mkdir -p "${output}"
          mapfile -t files < <(find "${input}" -maxdepth 1 -name '*.csv' -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No candle files were generated' >&2
            exit 1
          fi
          node research/stocks-in-play-orb-backtest.mjs "${files[@]}" > "${output}/study.json"
          cp "${input}/manifest.json" "${output}/data-manifest.json"

      - name: Upload study result
        uses: actions/upload-artifact@v4
        with:
          name: stocks-in-play-orb-${{ matrix.period.key }}-${{ github.run_id }}
          path: outputs/stocks-in-play-orb/${{ matrix.period.key }}/
          if-no-files-found: error
          retention-days: 30
