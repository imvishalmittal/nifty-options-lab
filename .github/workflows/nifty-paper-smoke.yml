name: NIFTY Paper Smoke

on:
  push:
    branches:
      - agent/groww-totp-smoke
    paths:
      - '.github/workflows/nifty-paper-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate paper and stepped-trail mechanics
        run: node --test tests/paper-engine.test.mjs tests/nifty-180-stepped-trail.test.mjs
      - name: Resolve Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Validate Groww authentication and historical NIFTY data
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GROWW_ACCESS_TOKEN;
          if (!token) throw new Error('GROWW_ACCESS_TOKEN is missing');
          const url = new URL('https://api.groww.in/v1/historical/candles');
          const params = {
            exchange: 'NSE',
            segment: 'CASH',
            groww_symbol: 'NSE-NIFTY',
            start_time: '2026-08-14 09:25:00',
            end_time: '2026-08-14 09:27:00',
            candle_interval: '1minute',
          };
          for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
          const response = await fetch(url, {
            headers: {
              Accept: 'application/json',
              Authorization: `Bearer ${token}`,
              'X-API-VERSION': '1.0',
            },
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || body.status === 'FAILURE') {
            throw new Error(`Groww smoke failed (${response.status}): ${body?.error?.message || body?.message || 'unknown error'}`);
          }
          const candles = body?.payload?.candles ?? body?.candles ?? [];
          if (!Array.isArray(candles) || candles.length === 0) throw new Error('Groww smoke returned no NIFTY candles');
          console.log(`Groww smoke OK: ${candles.length} historical NIFTY candle(s) fetched`);
          NODE
