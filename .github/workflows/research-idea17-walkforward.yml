name: Research - Idea 17 walk-forward closure\non:\n  push:\n    branches: [agent/idea10-underlying-option-confirmation]\n    paths:\n      - research/idea17-walkforward.mjs\n      - .github/workflows/research-idea17-walkforward.yml\n  workflow_dispatch:\npermissions: { contents: write }\njobs:\n  walkforward:\n    runs-on: ubuntu-latest\n    timeout-minutes: 350\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with: { node-version: 22 }\n      - name: Resolve Groww token\n        env:\n          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}\n          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}\n          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}\n          GROWW_PREFER_TOTP: 'true'\n        run: node scripts/resolve-groww-token.mjs\n      - name: Run Idea10A discovery baseline\n        run: node research/groww-idea10-2026-diagnostic.mjs --start=2020-01-01 --end=2024-12-31 --variant=A --out=idea17-baseline-discovery.json\n      - name: Run Idea10A validation baseline\n        run: node research/groww-idea10-2026-diagnostic.mjs --start=2025-01-01 --end=2025-12-31 --variant=A --out=idea17-baseline-validation.json\n      - name: Run Idea10A holdout baseline\n        run: node research/groww-idea10-2026-diagnostic.mjs --start=2026-01-01 --end=2026-09-19 --variant=A --out=idea17-baseline-holdout.json\n      - name: Run Idea17 walk-forward\n        run: node research/idea17-walkforward.mjs --out=idea17-walkforward.json\n      - uses: actions/upload-artifact@v4\n        with:\n          name: idea17-walkforward-closure\n          path: |\n            idea17-walkforward.json\n            idea17-baseline-discovery.json\n            idea17-baseline-validation.json\n            idea17-baseline-holdout.json\n          retention-days: 90\n      - name: Persist result\n        if: success()\n        run: |\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add idea17-walkforward.json\n          git diff --cached --quiet || git commit -m 'Persist Idea 17 walk-forward closure result'\n          git push origin HEAD:agent/idea10-underlying-option-confirmation\n