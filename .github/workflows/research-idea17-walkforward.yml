name: Research - Idea 17 walk-forward closure
on:
  push:
    branches: [agent/idea10-underlying-option-confirmation]
    paths:
      - research/idea17-walkforward.mjs
      - .github/workflows/research-idea17-walkforward.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Groww token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs

      - name: Run Idea10A discovery baseline
        run: node research/groww-idea10-2026-diagnostic.mjs --start=2020-01-01 --end=2024-12-31 --variant=A --out=idea17-baseline-discovery.json

      - name: Run Idea10A validation baseline
        run: node research/groww-idea10-2026-diagnostic.mjs --start=2025-01-01 --end=2025-12-31 --variant=A --out=idea17-baseline-validation.json

      - name: Run Idea10A holdout baseline
        run: node research/groww-idea10-2026-diagnostic.mjs --start=2026-01-01 --end=2026-09-19 --variant=A --out=idea17-baseline-holdout.json

      - name: Run Idea17 walk-forward
        run: node research/idea17-walkforward.mjs --out=idea17-walkforward.json

      - uses: actions/upload-artifact@v4
        with:
          name: idea17-walkforward-closure
          path: |
            idea17-walkforward.json
            idea17-baseline-discovery.json
            idea17-baseline-validation.json
            idea17-baseline-holdout.json
          retention-days: 90

      - name: Persist result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add idea17-walkforward.json
          git diff --cached --quiet || git commit -m 'Persist Idea 17 walk-forward closure result'
          git push origin HEAD:agent/idea10-underlying-option-confirmation
