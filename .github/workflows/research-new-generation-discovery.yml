name: Research - New generation P1 P2 P4 P5 P6
on:
  workflow_dispatch:
  push:
    branches: [agent/new-generation-runs]
    paths: [research/requests/new-generation.json]
permissions: { contents: read }
jobs:
  history:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: { year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022] }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/positional-futures-engine.test.mjs tests/longer-dte-options-engine.test.mjs tests/event-conditioned-futures-engine.test.mjs
      - run: node research/download-nse-futures-history.mjs --include-options=true --concurrency=2 --start=${{ matrix.year }}-01-01 --end=${{ matrix.year }}-12-31 --out=nifty-derivatives-${{ matrix.year }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'new-generation-${{ matrix.year }}', path: 'nifty-derivatives-${{ matrix.year }}.json', if-no-files-found: error, retention-days: 90 }
  evaluate:
    needs: history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'new-generation-*', path: shards, merge-multiple: true }
      - run: node research/run-positional-futures-backtest.mjs --in=shards --start=2016-01-01 --end=2022-12-31 --out=p1.json
      - run: node research/positional-futures-gates.mjs --in=p1.json --out=p1-gates.json
      - run: node research/run-longer-dte-options-backtest.mjs --in=shards --start=2016-01-01 --end=2022-12-31 --out=p2-p4-p6.json
      - run: node research/longer-dte-options-gates.mjs --in=p2-p4-p6.json --out=p2-p4-p6-gates.json
      - run: node research/run-event-conditioned-futures.mjs --in=shards --start=2016-01-01 --end=2022-12-31 --out=p5.json
      - run: node research/event-conditioned-futures-gates.mjs --in=p5.json --out=p5-gates.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-generation-discovery-2016-2022
          path: |
            p1.json
            p1-gates.json
            p2-p4-p6.json
            p2-p4-p6-gates.json
            p5.json
            p5-gates.json
          if-no-files-found: error
          retention-days: 90
