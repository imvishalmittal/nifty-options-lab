name: Research - NIFTY afternoon compression breakout

on:
  workflow_dispatch:
    inputs:
      scope: { description: Backtest partition set, required: true, type: choice, default: validation-2025, options: [discovery-2020-2024, validation-2025, holdout-2026, custom] }
      custom_start: { description: 'YYYY-MM-DD (custom only)', required: false, type: string }
      custom_end: { description: 'YYYY-MM-DD (custom only)', required: false, type: string }
      custom_lot_size: { description: Lot size (custom only), required: false, type: number, default: 65 }
      suite_run: { description: Internal opportunity-suite continuation marker, required: false, type: boolean, default: false }
  push:
    branches: [research/afternoon-validation-2025]
    paths: [research/opportunity/requests/afternoon-breakout.json]
permissions: { contents: read, actions: write }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.result }}', count: '${{ steps.matrix.outputs.count }}' }
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env: { INPUT_SCOPE: '${{ inputs.scope }}', INPUT_CUSTOM_START: '${{ inputs.custom_start }}', INPUT_CUSTOM_END: '${{ inputs.custom_end }}', INPUT_CUSTOM_LOT: '${{ inputs.custom_lot_size }}', REQUEST_FILE: research/opportunity/requests/afternoon-breakout.json }
        run: node research/opportunity/workflow-plan.mjs
  backtest:
    needs: plan
    strategy: { fail-fast: false, max-parallel: 1, matrix: '${{ fromJSON(needs.plan.outputs.matrix) }}' }
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/opportunity-engine.test.mjs
      - name: Resolve Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - run: node research/opportunity/groww-opportunity-backtest.mjs --strategy=afternoon-compression-breakout --start=${{ matrix.start }} --end=${{ matrix.end }} --lot-size=${{ matrix.lot }} --out=result.json
      - run: node research/opportunity/result-integrity.mjs --in=result.json --out=integrity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'opportunity-afternoon-compression-breakout-part-${{ matrix.label }}', path: "result.json\nintegrity.json", retention-days: 90 }
  consolidate:
    if: ${{ !cancelled() }}
    needs: [plan, backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'opportunity-afternoon-compression-breakout-part-*', path: artifacts }
      - run: node research/opportunity/aggregate-results.mjs --dir=artifacts --strategy=afternoon-compression-breakout --expected-count=${{ needs.plan.outputs.count }} --out=consolidated.json
      - run: node research/opportunity/result-integrity.mjs --in=consolidated.json --out=consolidated-integrity.json
      - uses: actions/upload-artifact@v4
        with: { name: opportunity-afternoon-compression-breakout-consolidated, path: "consolidated.json\nconsolidated-integrity.json", retention-days: 90 }
  notify-suite:
    if: ${{ always() && inputs.suite_run == true }}
    needs: [plan, backtest, consolidate]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.plan.result == 'success' && needs.backtest.result == 'success' && needs.consolidate.result == 'success' && 'success' || 'failure' }}
        run: gh workflow run nifty-opportunity-suite-chain.yml --ref main -f completed_workflow='Research - NIFTY afternoon compression breakout' -f completed_run_id=${{ github.run_id }} -f conclusion=$OUTCOME
