name: Research - VIX-high opening-range credit
on:
  workflow_dispatch:
  push:
    branches: [agent/more-ideas-c3-runs]
    paths: [research/requests/vix-high-opening-range-credit.json]
permissions: { contents: read, actions: write }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: true }
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/backtest-vix-high-opening-range-credit.test.mjs tests/groww-opening-range-credit-backtest.test.mjs tests/opening-range-credit.test.mjs tests/vol-regime-filter.test.mjs tests/vix-filter-shard-mergers.test.mjs
      - name: Resolve one Groww token for the complete run
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run all monthly C3 shards
        run: |
          set -euo pipefail
          mkdir -p shards
          for year in $(seq 2020 2024); do for month in $(seq -w 1 12); do
            key="$year-$month"; end=$(date -u -d "$key-01 +1 month -1 day" +%Y-%m-%d)
            node research/backtest-vix-high-opening-range-credit.mjs --start="$key-01" --end="$end" --out="shards/vix-high-opening-range-credit-$key.json"
          done; done
      - run: node research/merge-vix-high-opening-range-credit-shards.mjs --in=shards --start=2020-01-01 --end=2024-12-31 --expected=60 --out=vix-high-opening-range-credit.json
      - run: node research/opening-range-credit-gates.mjs --in=vix-high-opening-range-credit.json --out=vix-high-opening-range-credit-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vix-high-opening-range-credit-discovery-2020-2024
          path: |
            shards
            vix-high-opening-range-credit.json
            vix-high-opening-range-credit-gate.json
          if-no-files-found: warn
          retention-days: 90
      - run: node research/opening-range-credit-gates.mjs --in=vix-high-opening-range-credit.json --out=vix-high-opening-range-credit-gate.json --enforce=true
  dispatch-trailing-validation:
    if: always()
    needs: research
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run research-profit-only-trailing-validation.yml --ref main
