name: Research - VIX-high opening-range credit

on:
  workflow_dispatch:
  push:
    branches: [agent/more-ideas-c3-runs]
    paths:
      - research/requests/vix-high-opening-range-credit.json
      - research/backtest-vix-high-opening-range-credit.mjs
      - .github/workflows/research-vix-high-opening-range-credit.yml

permissions: { contents: read }
concurrency: { group: groww-opportunity-backtest-api, cancel-in-progress: false }

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      START_DATE: '2020-01-01'
      END_DATE: '2024-12-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/backtest-vix-high-opening-range-credit.test.mjs tests/opening-range-credit.test.mjs tests/vol-regime-filter.test.mjs
      - name: Resolve request
        if: github.event_name == 'push'
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('research/requests/vix-high-opening-range-credit.json','utf8'));fs.appendFileSync(process.env.GITHUB_ENV,'START_DATE='+r.start+'\nEND_DATE='+r.end+'\n')"
      - name: Resolve Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs
      - name: Run C3 discovery
        run: node research/backtest-vix-high-opening-range-credit.mjs --start=$START_DATE --end=$END_DATE --out=vix-high-opening-range-credit.json
      - name: Evaluate frozen gates
        run: node research/opening-range-credit-gates.mjs --in=vix-high-opening-range-credit.json --out=vix-high-opening-range-credit-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vix-high-opening-range-credit-${{ env.START_DATE }}-${{ env.END_DATE }}
          path: |
            vix-high-opening-range-credit.json
            vix-high-opening-range-credit-gate.json
          retention-days: 90
      - name: Enforce frozen gates
        run: node research/opening-range-credit-gates.mjs --in=vix-high-opening-range-credit.json --out=vix-high-opening-range-credit-gate.json --enforce=true
