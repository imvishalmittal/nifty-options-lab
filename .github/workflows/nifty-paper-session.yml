name: NIFTY Paper Session

on:
  schedule:
    # Native GitHub cron is a secondary fallback. Cloudflare dispatches at
    # 09:20 and 09:25 IST; this fallback is due at 09:20 IST.
    - cron: '50 3 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Force a rerun even when today's paper session is already terminal
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nifty-paper-session
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard completed paper session
        id: guard
        env:
          FORCE: ${{ inputs.force }}
          V4_STATUS_PATH: public/paper/v4-session-status.json
        run: node paper/session-guard.mjs

      - name: Resolve Groww access token
        if: steps.guard.outputs.run == 'true'
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          GROWW_PREFER_TOTP: 'true'
        run: node scripts/resolve-groww-token.mjs

      - name: Run base and V4 paper sessions
        if: steps.guard.outputs.run == 'true'
        env:
          GROWW_REQUEST_SPACING_MS: '1500'
        run: |
          set +e
          node paper/run-session.mjs > /tmp/base-paper.log 2>&1 &
          base_pid=$!
          node paper/run-v4-session.mjs > /tmp/v4-paper.log 2>&1 &
          v4_pid=$!

          wait "$base_pid"
          base_rc=$?
          wait "$v4_pid"
          v4_rc=$?
          set -e

          echo "===== Base paper session ====="
          cat /tmp/base-paper.log
          echo "===== V4 paper session ====="
          cat /tmp/v4-paper.log

          node paper/merge-v4-ledger.mjs

          if [ "$base_rc" -ne 0 ] || [ "$v4_rc" -ne 0 ]; then
            echo "Paper runner failure: base=$base_rc v4=$v4_rc"
            exit 1
          fi

      - name: Persist paper journal
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper/trades.json public/paper/session-status.json public/paper/v4-trades.json public/paper/v4-session-status.json public/paper/sessions.json
          if git diff --cached --quiet; then
            echo "No paper journal change"
          else
            git commit -m "Update NIFTY paper journal $(date -u +%F)"
            git push origin HEAD:main
          fi
