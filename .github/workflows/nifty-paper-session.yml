name: NIFTY Paper Session

on:
  schedule:
    # Native GitHub cron is a secondary fallback. Cloudflare dispatches at
    # 09:20 and 09:23 IST; this fallback is due at 09:20 IST.
    - cron: '50 3 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Force a rerun even when today's paper session is already terminal
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nifty-paper-session
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard completed paper session
        id: guard
        env:
          FORCE: ${{ inputs.force }}
        run: node paper/session-guard.mjs

      - name: Resolve Groww access token
        if: steps.guard.outputs.run == 'true'
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: node scripts/resolve-groww-token.mjs

      - name: Run deterministic paper session
        if: steps.guard.outputs.run == 'true'
        env:
          GROWW_REQUEST_SPACING_MS: '1500'
        run: node paper/run-session.mjs

      - name: Persist paper journal
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper/trades.json public/paper/session-status.json
          if git diff --cached --quiet; then
            echo "No paper journal change"
          else
            git commit -m "Update NIFTY paper journal $(date -u +%F)"
            git push origin HEAD:main
          fi
