name: Research - Idea 20 exit-side diagnostic

on:
  push:
    paths:
      - research/idea20-exit-side-diagnostic.mjs
      - research/groww-generate-access-token.mjs
      - .github/workflows/research-idea20-exit-side-diagnostic.yml
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
      GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Validate TOTP secrets
        run: |
          if [ -z "$GROWW_TOTP_TOKEN" ]; then
            echo "::error::GROWW_TOTP_TOKEN is missing. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$GROWW_TOTP_SECRET" ]; then
            echo "::error::GROWW_TOTP_SECRET is missing. Add it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Both TOTP secrets are configured."

      - name: Generate fresh Groww access token
        run: node research/groww-generate-access-token.mjs

      - name: Run Idea 20 diagnostic
        env:
          GROWW_REQUEST_SPACING_MS: 1500
          OUT: idea20-2026-diagnostic.json
        run: node research/idea20-exit-side-diagnostic.mjs

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea20-2026-diagnostic
          path: idea20-2026-diagnostic.json
          if-no-files-found: error
