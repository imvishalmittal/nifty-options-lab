name: Research - Idea 20 exit-side diagnostic

on:
  push:
    paths:
      - research/idea20-exit-side-diagnostic.mjs
      - research/groww-generate-access-token.mjs
      - .github/workflows/research-idea20-exit-side-diagnostic.yml
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROWW_TOTP_API_KEY: ${{ secrets.GROWW_TOTP_API_KEY }}
      GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Generate fresh Groww access token
        env:
          GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
        run: |
          if [ -n "$GROWW_TOTP_API_KEY" ] && [ -n "$GROWW_TOTP_SECRET" ]; then
            node research/groww-generate-access-token.mjs
          elif [ -n "$GROWW_ACCESS_TOKEN" ]; then
            echo "No TOTP secrets configured; using the static-token fallback."
            echo "GROWW_ACCESS_TOKEN=$GROWW_ACCESS_TOKEN" >> "$GITHUB_ENV"
          else
            echo "::error::Configure GROWW_TOTP_API_KEY and GROWW_TOTP_SECRET for automatic token generation."
            exit 1
          fi

      - name: Validate authentication configuration
        run: |
          if [ -z "$GROWW_ACCESS_TOKEN" ]; then
            echo "::error::No Groww access token was generated or configured."
            exit 1
          fi
          if [ -z "$GROWW_TOTP_API_KEY" ] || [ -z "$GROWW_TOTP_SECRET" ]; then
            echo "::warning::Using static GROWW_ACCESS_TOKEN fallback. It expires daily at 6:00 AM and may be stale."
          else
            echo "TOTP-based authentication configured; fresh token is available to subsequent steps."
          fi

      - name: Run Idea 20 diagnostic
        env:
          GROWW_REQUEST_SPACING_MS: 1500
          OUT: idea20-2026-diagnostic.json
        run: node research/idea20-exit-side-diagnostic.mjs

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea20-2026-diagnostic
          path: idea20-2026-diagnostic.json
          if-no-files-found: error
