name: Research - Idea 20 exit-side diagnostic

on:
  push:
    paths:
      - research/idea20-exit-side-diagnostic.mjs
      - .github/workflows/research-idea20-exit-side-diagnostic.yml
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROWW_ACCESS_TOKEN: ${{ secrets.GROWW_ACCESS_TOKEN }}
      GROWW_TOTP_API_KEY: ${{ secrets.GROWW_TOTP_API_KEY }}
      GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Generate fresh Groww access token
        run: |
          if [ -n "$GROWW_TOTP_API_KEY" ] && [ -n "$GROWW_TOTP_SECRET" ]; then
            node research/groww-generate-access-token.mjs
          else
            echo "No TOTP secrets configured; will use GROWW_ACCESS_TOKEN fallback."
          fi

      - name: Validate authentication configuration
        run: |
          if [ -z "$GROWW_TOTP_API_KEY" ] || [ -z "$GROWW_TOTP_SECRET" ]; then
            if [ -z "$GROWW_ACCESS_TOKEN" ]; then
              echo "::error::Configure GROWW_TOTP_API_KEY and GROWW_TOTP_SECRET for automatic token generation, or provide a current GROWW_ACCESS_TOKEN."
              exit 1
            fi
            echo "::warning::Using GROWW_ACCESS_TOKEN fallback. Groww access tokens expire daily at 6:00 AM; this may fail if stale."
          fi

      - name: Run Idea 20 diagnostic
        env:
          GROWW_REQUEST_SPACING_MS: 1500
          OUT: idea20-2026-diagnostic.json
        run: node research/idea20-exit-side-diagnostic.mjs

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: idea20-2026-diagnostic
          path: idea20-2026-diagnostic.json
          if-no-files-found: error
