name: Research - ETF dip recovery 3-year replay

run-name: ETF dip recovery ${{ inputs.start_date || '2023-08-28' }} to ${{ inputs.end_date || '2026-08-27' }}

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First trading date to test
        required: true
        default: '2023-08-28'
      end_date:
        description: Last trading date to test
        required: true
        default: '2026-08-27'
  push:
    branches: [research/etf-dip-recovery-3m]
    paths:
      - research/etf-dip-recovery/requests/run-3y.json

permissions:
  contents: read

concurrency:
  group: dhan-etf-backtest-api
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify frozen strategy, Dhan adapter, and integrity tests
        run: >-
          node --test
          tests/etf-dip-recovery-engine.test.mjs
          tests/etf-dip-recovery-integrity.test.mjs
          tests/dhan-etf-dip-recovery.test.mjs

      - name: Verify read-only historical-data credential is present
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: test -n "$DHAN_ACCESS_TOKEN"

      - name: Run exact five-minute ETF replay
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: >-
          node research/dhan-etf-dip-recovery-backtest.mjs
          --start=${{ inputs.start_date || '2023-08-28' }}
          --end=${{ inputs.end_date || '2026-08-27' }}
          --pause-ms=225
          --out=etf-dip-recovery-3y-result.json

      - name: Audit result integrity
        if: ${{ always() && hashFiles('etf-dip-recovery-3y-result.json') != '' }}
        run: >-
          node research/etf-dip-recovery-integrity.mjs
          --in=etf-dip-recovery-3y-result.json
          --out=etf-dip-recovery-3y-integrity.json
          --start=${{ inputs.start_date || '2023-08-28' }}
          --end=${{ inputs.end_date || '2026-08-27' }}
          --require-capital=true

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-dip-recovery-3y-${{ inputs.start_date || '2023-08-28' }}-${{ inputs.end_date || '2026-08-27' }}
          path: |
            etf-dip-recovery-3y-result.json
            etf-dip-recovery-3y-integrity.json
          if-no-files-found: warn
          retention-days: 90
